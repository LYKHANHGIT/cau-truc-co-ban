[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "task-runner"
version = "0.1.0"
description = "A powerful command-line tool for managing tasks efficiently"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "LYKHANHGIT", email = "kojilamaimai020925@gmail.com"},
]
keywords = ["cli", "tool", "task", "task-manager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8+",
]

dependencies = [
    "click>=8.0",
    "colorama>=0.4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
]

[project.scripts]
task-runner = "task_runner.cli:main"

[project.urls]
Homepage = "https://github.com/LYKHANHGIT/cau-truc-co-ban"
Documentation = "https://github.com/LYKHANHGIT/cau-truc-co-ban/blob/main/README.md"
Repository = "https://github.com/LYKHANHGIT/cau-truc-co-ban.git"
"Bug Tracker" = "https://github.com/LYKHANHGIT/cau-truc-co-ban/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=src/task_runner --cov-report=html --cov-report=term-missing"
